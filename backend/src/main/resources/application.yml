spring:
  profiles:
    active: local
  main:
    lazy-initialization: true


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # 절대 create, update, create-drop 사용 금지 — DDL은 db/ 폴더의 SQL로 직접 관리
      ddl-auto: none
      # Spring Boot 3.x 기본 전략(CamelCaseToUnderscoresNamingStrategy)은 @Table(name="Category")까지
      # 소문자로 변환 → Linux MySQL(case-sensitive)에서 "table doesn't exist" 발생. 이름 보존 전략으로 고정.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

server:
  port: 8080



# 실제 DB 접속 정보는 application-local.yml에 작성하세요.
# docs/application-local.example.yml을 참고하여 생성합니다.

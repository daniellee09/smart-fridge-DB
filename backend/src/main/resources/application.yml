spring:
  profiles:
    active: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # 절대 create, update, create-drop 사용 금지 — DDL은 db/ 폴더의 SQL로 직접 관리
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

server:
  port: 8080

# 실제 DB 접속 정보는 application-local.yml에 작성하세요.
# docs/application-local.example.yml을 참고하여 생성합니다.
